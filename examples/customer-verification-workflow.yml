# Adapt to your repository and copy to .github/workflows/resilyne-verify.yml.
# Requires package-lock.json and an npm test script. Select this workflow during onboarding.
name: Resilyne verification
on:
  push:
    branches: [main, "resilyne/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare dependencies without lifecycle scripts
        run: |
          docker pull node:22-bookworm-slim
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --memory=1g --cpus=1 --pids-limit=128 -v "$PWD:/work" -w /work node:22-bookworm-slim npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests in restricted container
        run: |
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges --memory=1g --cpus=1 --pids-limit=128 -v "$PWD:/work:ro" -w /work -e HOME=/tmp node:22-bookworm-slim npm test
