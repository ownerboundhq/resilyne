services:
  neuravale:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      NEURAVALE_MODEL: qwen2.5:3b
      NEURAVALE_DB: /app/data/neuravale.sqlite3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - neuravale-data:/app/data
volumes:
  neuravale-data:
