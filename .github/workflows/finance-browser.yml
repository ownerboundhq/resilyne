name: Finance browser integration
on:
  push:
    paths:
      - 'finance/**'
      - 'tests/test_finance_browser.py'
      - '.github/workflows/finance-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r finance/requirements-desktop.txt
      - run: python -m playwright install chromium
      - run: python -m unittest discover -s tests -p "test_finance*.py" -v
