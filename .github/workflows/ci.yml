name: Resilyne CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resilyne
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: resilyne_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resilyne"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://resilyne:test-only@localhost:5432/resilyne_test
      RESILYNE_DB_TEST: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: find lib saas test -name '*.mjs' -o -name '*.js' | xargs -r -n1 node --check
      - run: npm run migrate
      - run: npm test
