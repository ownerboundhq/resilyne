name: Finance Windows download
on:
  push:
    paths:
      - '.github/workflows/finance-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finance-windows-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\finance-build-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging tools and browser
        run: |
          python -m pip install -r finance/requirements-desktop.txt pyinstaller==6.16.0
          python -m playwright install chromium
      # Rebuild with regression test scoped to the monthly package, not extended reports.
      - name: Run source tests
        run: python -m unittest discover -s tests -p "test_finance*.py" -v
      - name: Package desktop
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name NeuravaleFinance --paths . --collect-all playwright --hidden-import finance.worker --hidden-import finance.office --hidden-import finance.schedule --hidden-import finance.desktop --hidden-import finance.browser_pilot --hidden-import finance.operation --hidden-import finance.month_end --hidden-import finance.close_specialists --hidden-import finance.integration_ui --hidden-import finance.integrations --hidden-import finance.computer_use --hidden-import finance.autonomy --hidden-import finance.intelligence --hidden-import finance.extended_finance --hidden-import PIL.ImageGrab --hidden-import PIL.ImageDraw --add-data "finance/operation.html;finance" --add-data "finance/dashboard.html;finance" --add-data "finance/sandbox.html;finance" --add-data "finance/excel_export.ps1;finance" finance/packaged_entry.py
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          Copy-Item -Recurse -LiteralPath $env:PLAYWRIGHT_BROWSERS_PATH -Destination dist/NeuravaleFinance/browsers
          Copy-Item finance/PACKAGED-README.txt dist/NeuravaleFinance/README.txt
      - name: Test packaged executable and browser
        shell: pwsh
        run: |
          $app = Join-Path (Get-Location) "dist/NeuravaleFinance/NeuravaleFinance.exe"
          $testDir = Join-Path $env:RUNNER_TEMP "finance-package-test"
          & $app --office --workspace $testDir demo
          if ($LASTEXITCODE -ne 0) { throw "Office demo failed" }
          & $app --browser --workspace $testDir --headless
          if ($LASTEXITCODE -ne 0) { throw "Packaged browser failed" }
          $output = & $app --worker --workspace $testDir status
          if ($LASTEXITCODE -ne 0) { throw "Packaged status failed" }
          $result = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($result.counts.batches -ne 1 -or $result.counts.open_exceptions -ne 2 -or $result.office.state -ne "complete") { throw "Unexpected packaged results" }
          if ($result.batches[0].report.difference_cents -ne 200 -or $result.office.report.treasury.illustrative_ending_cash_cents -ne 575000) { throw "Packaged accounting outputs incorrect" }
          Write-Host "Packaged browser export and office report verified."
          $operationDir = Join-Path $env:RUNNER_TEMP "finance-operation-package-test"
          $output = & $app --operation --workspace $operationDir --headless
          if ($LASTEXITCODE -ne 0) { throw "Packaged operation failed" }
          $operation = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($operation.before -ne 2 -or $operation.after -ne 1) { throw "Practice correction not verified" }
          $closeDir = Join-Path $env:RUNNER_TEMP "finance-close-package-test"
          & $app --month-end --workspace $closeDir demo --advanced
          if ($LASTEXITCODE -ne 0) { throw "Month-end demo failed" }
          $output = & $app --month-end --workspace $closeDir once
          if ($LASTEXITCODE -ne 0) { throw "Month-end close failed" }
          $close = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($close.state -ne "ready" -or $close.report.income_statement.net_income_cents -ne 125000 -or $close.report.specialists.adjustments.generated_journals.Count -ne 4) { throw "Month-end outputs incorrect" }
          & $app --month-end --workspace $closeDir seal $close.period $close.id
          if ($LASTEXITCODE -ne 0) { throw "Month-end seal failed" }
          & $app --computer-use --self-test
          if ($LASTEXITCODE -ne 0) { throw "Computer-use offline self-test failed" }
          $autoDir = Join-Path $env:RUNNER_TEMP "finance-auto-package-test"
          $out = & $app --autonomy --workspace $autoDir once
          if ($LASTEXITCODE -ne 0) { throw "Autonomy test failed" }
          $auto = ($out -join [Environment]::NewLine) | ConvertFrom-Json
          if ($auto.month_end.state -ne "completed" -or $auto.browser.state -ne "needs_review" -or $auto.intelligence.state -ne "prepared") { throw "Autonomy results incorrect" }
      - name: Create download and checksum
        shell: pwsh
        run: |
          $name = "NeuravaleFinance-Windows-x64.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Join-Path (Get-Location) "dist/NeuravaleFinance"),(Join-Path (Get-Location) $name),[IO.Compression.CompressionLevel]::Fastest,$true)
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii -Path "$name.sha256" -Value "$hash  $name"
      - uses: actions/upload-artifact@v4
        with:
          name: NeuravaleFinance-Windows-x64
          path: |
            NeuravaleFinance-Windows-x64.zip
            NeuravaleFinance-Windows-x64.zip.sha256
          compression-level: 0
      - name: Publish verified portable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "finance-v0.11.0"
          gh release create $tag NeuravaleFinance-Windows-x64.zip NeuravaleFinance-Windows-x64.zip.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Neuravale Finance Desktop 0.11.0 - Windows x64" --notes "Portable unsigned Windows preview. Extract all files and double-click NeuravaleFinance.exe. Source and frozen browser/reconciliation smoke tests must pass before publication. Fictional data only; four test-only read adapters; no production accounting connections or tax filing. Includes a restricted physical Windows input pilot. Offline visual detection and journal tests are required; real interactive mouse/keyboard and Excel are not validated by this workflow." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
